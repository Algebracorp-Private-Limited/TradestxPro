# XChart SDK continuous integration.
# Required checks (configure in branch protection, by job name):
#   - "XChart CI / quality"   (typecheck, lint, unit tests, production build)
#   - "XChart CI / browser"   (mandatory Playwright + Chromium canvas tests)
name: XChart CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/xchart-sdk-foundation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xchart-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Safe, non-production build configuration: no database, broker or e-mail credentials are used.
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22.13+ is needed for --experimental-strip-types and module.stripTypeScriptTypes.
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        # Browser tests are covered by the "browser" job; here they may skip if Chromium is absent.
        run: npm test
      - name: Production build
        run: npm run build

  browser:
    name: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install dependencies (lockfile, pins playwright@1.63.0)
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Mandatory browser tests (fail instead of skipping)
        env:
          XCHART_REQUIRE_BROWSER: "1"
        run: |
          node --test --experimental-strip-types --no-warnings --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=browser-tests.tap tests/xchart-sdk-browser.test.ts
          # The benchmark test is the only one allowed to skip.
          skipped=$(grep -c "# SKIP" browser-tests.tap || true)
          if [ "$skipped" -gt 1 ]; then echo "::error::Unexpected skipped browser tests ($skipped)"; exit 1; fi
          if grep -E "^not ok" browser-tests.tap; then exit 1; fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-tests
          path: browser-tests.tap
          if-no-files-found: ignore
